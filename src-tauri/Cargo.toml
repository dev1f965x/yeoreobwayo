[package]
name = "yeoreobwayo"
version = "1.0.0"
description = "The fridge, filled in as the bag is unpacked"
authors = ["dev1f965x"]
edition = "2021"

[lib]
name = "yeoreobwayo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
